apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: holton-blog-gateway
  namespace: holton-blog
spec:
  gatewayClassName: cilium
  listeners:
  - name: https
    hostname: holton.blog
    port: 443
    protocol: HTTPS
    tls:
      mode: Terminate
      certificateRefs:
      - name: holton-blog-cert
        kind: Secret
    allowedRoutes:
      namespaces:
        from: Same
